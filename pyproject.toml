[project]
name = "cerberus"
version = "0.01"
description = "Cerberus - unified policy routing service (Dispatch, Free Router, Fusion)"
readme = "README.md"
requires-python = "==3.14.5"
license = { file = "LICENSE" }
authors = [{ name = "Deep-Sixed" }]
dependencies = [
  "fastapi>=0.135,<1",
  "httpx>=0.28,<1",
  "pydantic>=2.12,<3",
  "PyYAML>=6.0,<7",
  "uvicorn[standard]>=0.41,<1",
  "pyjwt[crypto]>=2.10,<3",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cerberus"]
# dashboard assets must ship in the wheel even if untracked at build time
artifacts = ["src/cerberus/ui/static/*"]

[project.scripts]
cerberus = "cerberus.cli:main"

[dependency-groups]
build = ["hatchling>=1.27,<2"]
dev = [
  "pytest>=9,<10",
  "pytest-asyncio>=1,<2",
  "ruff>=0.15,<1",
  "hatchling>=1.27,<2",
]

[tool.uv]
# Pin the interpreter SOURCE, not just its version. `requires-python` fixes 3.14.5,
# but uv's default preference accepts whichever 3.14.5 is already present: a
# uv-managed install where one exists, otherwise a system one (in CI, the
# interpreter actions/setup-python puts in the hosted tool cache). Those are
# different builds with different bundled libraries - notably SQLite, where the
# managed build shipped 3.53.1 while CI's shipped 3.45.1. That divergence let a
# test pass locally and fail in CI on ALTER TABLE ... DROP COLUMN semantics.
# "only-managed" makes both sides resolve the same build from one declaration.
python-preference = "only-managed"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 120
target-version = "py314"
