name: cerberus
services:
  cerberus-api:
    image: cerberus:0.01
    build:
      context: ../..
      dockerfile: Containerfile
    restart: unless-stopped
    ports: ["127.0.0.1:4000:4101"]
    networks: [worker]
    environment:
      CERBERUS_CONFIG: /etc/cerberus/config.yaml
      CERBERUS_RELEASE_ID: cerberus-0.01
      CERBERUS_API_TOKEN: ${CERBERUS_API_TOKEN:?Set CERBERUS_API_TOKEN}
      CERBERUS_ADMIN_TOKEN: ${CERBERUS_ADMIN_TOKEN:?Set CERBERUS_ADMIN_TOKEN}
      CB_KEY_DEV: ${CB_KEY_DEV:?Set CB_KEY_DEV}
      CB_KEY_WORKER: ${CB_KEY_WORKER:?Set CB_KEY_WORKER}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
      CERBERUS_FUSION_WORKER_TOKEN: ${CERBERUS_FUSION_WORKER_TOKEN:?Set CERBERUS_FUSION_WORKER_TOKEN}
    volumes:
      - ../../config/fusion-dev.yaml:/etc/cerberus/config.yaml:ro
      - cerberus-state:/var/lib/cerberus
    depends_on:
      cerberus-fusion-worker: {condition: service_healthy}
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:4101/health', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
  cerberus-fusion-worker:
    image: cerberus-fusion-worker:0.01
    build:
      context: ../..
      dockerfile: third_party/Containerfile.fusion_backend
    restart: unless-stopped
    networks: [worker]
    environment:
      FUSION_BACKEND_CONFIG: /etc/fusion_backend/worker.yaml
      FUSION_BACKEND_NO_OPEN: "1"
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
      CERBERUS_FUSION_WORKER_TOKEN: ${CERBERUS_FUSION_WORKER_TOKEN:?Set CERBERUS_FUSION_WORKER_TOKEN}
    volumes:
      - ../../worker.generated.yaml:/etc/fusion_backend/worker.yaml:ro
    healthcheck:
      test: ["CMD", "/app/.venv/bin/python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=3)"]
      interval: 20s
      timeout: 5s
      retries: 3
networks:
  worker: {driver: bridge}
volumes:
  cerberus-state:
