# Cerberus example configuration — portable schema reference.
# Secrets are env-var NAMES populated by the file-secrets bridge; never values.
metadata:
  version: cerberus-2026-07-16.1

server:
  host: 127.0.0.1
  port: 4000

state:
  path: /var/lib/cerberus/cooldowns.db   # null -> in-memory (tests, dry runs)

providers:
  openrouter:
    protocol: openai
    base_url: https://openrouter.ai/api/v1
    credentials:
      primary: { api_key_env: OPENROUTER_API_KEY }
    models:
      openrouter/free: { cost_tier: free, capabilities: [chat, tools] }
      # strength is read only by jev aliases: Jev weighs it against cost
      anthropic/claude-sonnet: { cost_tier: paid, strength: frontier, capabilities: [chat, tools, coding] }
      google/gemini-pro: { cost_tier: paid, capabilities: [chat, tools, coding] }

  google:
    protocol: openai
    base_url: https://generativelanguage.googleapis.com/v1beta/openai
    credentials:
      free-1: { api_key_env: GEMINI_KEY_1 }
    models:
      gemini-flash: { cost_tier: free, strength: standard, capabilities: [chat, tools] }
    quota_cooldown_seconds: 14400   # daily free-tier quota
    transport_cooldown_seconds: 30  # network blips never brick a provider for hours
    quota_scope: model              # credential = one 429 cools every model on that key

aliases:
  cerberus/free:
    mode: free                      # free-mode: paid candidates are a validation error
    candidates:
      - { provider: google, credential: free-1, model: gemini-flash }
      - { provider: openrouter, credential: primary, model: openrouter/free }

  cerberus/dispatch-standard:
    mode: dispatch
    allow_paid_fallback: true
    candidates:
      - { provider: openrouter, credential: primary, model: anthropic/claude-sonnet }
      - { provider: openrouter, credential: primary, model: openrouter/free }

  cerberus/fusion-code:
    mode: fusion
    # Deliberation is delegated to a managed backend (OpenRouter Fusion Router),
    # so the whole panel and the judge (analyst) share one provider/credential.
    # One fusion request is billed as every panel call plus the analyst.
    candidates:                     # the panel
      - { provider: openrouter, credential: primary, model: openrouter/free }
      - { provider: openrouter, credential: primary, model: anthropic/claude-sonnet }
    fusion:
      backend: openrouter
      max_panel_members: 5
      timeout_seconds: 180
      allow_paid_panel: true
      judge: { provider: openrouter, credential: primary, model: openrouter/free }
      require_human_review: true

  cerberus/auto:
    mode: jev-router
    # Jev as one model-selection strategy under Cerberus policy. Before every
    # request Cerberus filters this pool by cost, health, cooldown and
    # credential; OpenRouter's Jev Router then picks one model (and its
    # reasoning effort) from what remains. Exact registry slugs only, all under
    # one OpenRouter credential. A response from outside the pool is withheld.
    candidates:                     # the pool; no preference order
      - { provider: openrouter, credential: primary, model: anthropic/claude-sonnet }
      - { provider: openrouter, credential: primary, model: google/gemini-pro }
    jev_router:
      backend: openrouter
      timeout_seconds: 120
      allow_paid_pool: true         # Jev often picks a paid model; opt in explicitly

  cerberus/smart:
    mode: jev
    # Jev as Cerberus's model-selection intelligence; Cerberus executes. The
    # pool may span any providers (local hosts included). Before each request
    # Cerberus filters it, asks Jev through OpenRouter's Decisions API which
    # remaining model is the cheapest one strong enough, then runs that model
    # first through its own failover loop. No usable answer -> configured order.
    candidates:                     # configured order is the fallback order
      - { provider: google, credential: free-1, model: gemini-flash }
      - { provider: openrouter, credential: primary, model: anthropic/claude-sonnet }
    jev:
      decider: { provider: openrouter, credential: primary }
      model: typesafe/jev-1.13      # pinned; bump deliberately after testing
      input: last_user_message      # or full_conversation, or metadata (no text)
      max_input_chars: 4000
      timeout_seconds: 5            # decision deadline; then configured order
      allow_paid_pool: true

identities:
  example-reader:
    credential_env: CB_KEY_EXAMPLE_READER    # holds a cb- client key
    allowed_modes: [free]           # deny-by-default: absence means denied
    allowed_aliases: [cerberus/free]
    default_alias: cerberus/free
