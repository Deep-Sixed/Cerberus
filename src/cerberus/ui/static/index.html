<!DOCTYPE html>
<!-- Cerberus console — the frozen console shell: revision/checksum/
     routable header, fixed navigation, first-run bring-up, and the candidate
     lifecycle. Read + live-probe, plus one narrow, allow-listed config write
     path (provider cooldowns/health-probe mode; secrets and structural fields
     are locked). No inline script/style, no native form-submission markup;
     every field control is built in app.js and issues same-origin requests
     only, CSRF-guarded for every write. CSP is set by the server. -->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Cerberus</title>
<link rel="stylesheet" href="/admin/ui/app.css">
</head>
<body>
<div id="app">

  <header id="topbar">
    <div class="brand"><span class="logo">C</span><span class="brandname">Cerberus</span></div>
    <div class="factbar">
      <div class="fact">
        <span class="fact-label" id="revisionLabel">Active revision</span>
        <span class="fact-value">
          <code id="revisionValue">&hellip;</code>
          <code class="fact-sub" id="revisionChecksum"></code>
        </span>
      </div>
      <div class="fact">
        <span class="fact-label">Gateway</span>
        <span class="fact-value"><code id="gatewayValue">&hellip;</code></span>
      </div>
      <div class="fact fact-last">
        <span class="fact-label">Routable now</span>
        <span class="fact-value"><span class="fact-plain" id="routableValue">&hellip;</span></span>
      </div>
    </div>
    <div class="fact fact-telemetry">
      <span class="fact-label">Telemetry</span>
      <span class="fact-value"><code id="telemetryValue">&hellip;</code></span>
    </div>
  </header>

  <div id="shell">
    <nav id="side" aria-label="Console sections">
      <div id="navlist"></div>
      <div class="side-foot">
        <span class="fact-label">Identities in revision</span>
        <div id="identityList"></div>
      </div>
    </nav>

    <main id="main">
      <section id="bringup" class="bringup" hidden></section>
      <div id="viewhead" class="viewhead" hidden></div>
      <section id="viewbody" class="viewbody"></section>
    </main>
  </div>

  <footer id="candidateBar" class="action-bar" hidden>
    <div class="action-meta">
      <strong id="candidateState">No candidate staged</strong>
      <small id="candidateDetail" class="muted"></small>
    </div>
    <div id="candidateMessage" class="message-area"></div>
    <div class="action-buttons">
      <button id="discardButton" class="destructive-button" type="button">Discard candidate</button>
      <button id="validateButton" class="secondary-button" type="button">Validate</button>
      <button id="activateButton" class="primary-button" type="button" disabled>Activate</button>
    </div>
  </footer>

</div>
<script src="/admin/ui/app.js"></script>
</body>
</html>
