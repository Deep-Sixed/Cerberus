<!DOCTYPE html>
<!-- Cerberus admin console. Read + live-probe, plus one narrow, allow-listed
     config write path (provider cooldowns/health-probe mode; secrets and
     structural fields are locked). No inline script/style, no native
     form-submission markup; interactive controls are built in app.js and
     issue same-origin
     requests only, CSRF-guarded for every write. CSP is set by the server. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cerberus</title>
<link rel="stylesheet" href="/admin/ui/app.css">
</head>
<body>
<div id="app">
  <nav id="side">
    <div class="brand"><span class="logo">C</span><div><b>Cerberus</b><small>gateway console</small></div></div>
    <div class="navgroup">
      <a data-view="overview" class="active">
        <svg class="nicon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="2" width="6" height="6" rx="1.3"/><rect x="10" y="2" width="6" height="6" rx="1.3"/>
          <rect x="2" y="10" width="6" height="6" rx="1.3"/><rect x="10" y="10" width="6" height="6" rx="1.3"/>
        </svg>
        <span>Overview</span>
      </a>
    </div>
    <div class="navgroup">
      <h6>Routing</h6>
      <a data-view="providers">
        <svg class="nicon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="2" y="3" width="14" height="5" rx="1.3"/><rect x="2" y="10" width="14" height="5" rx="1.3"/>
          <circle cx="5" cy="5.5" r=".9" fill="currentColor" stroke="none"/><circle cx="5" cy="12.5" r=".9" fill="currentColor" stroke="none"/>
        </svg>
        <span>Providers</span>
      </a>
      <a data-view="routing">
        <svg class="nicon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="4" cy="4" r="1.6"/><circle cx="4" cy="14" r="1.6"/><circle cx="14" cy="9" r="1.6"/>
          <path d="M5.4 4.9 L9 9 M5.4 13.1 L9 9 M10.6 9 L12.4 9"/>
        </svg>
        <span>Model Routing</span>
      </a>
      <a data-view="config">
        <svg class="nicon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="9" cy="9" r="2.2"/>
          <path d="M9 2.2v2M9 13.8v2M2.2 9h2M13.8 9h2M4.4 4.4l1.4 1.4M12.2 12.2l1.4 1.4M4.4 13.6l1.4-1.4M12.2 5.8l1.4-1.4"/>
        </svg>
        <span>Config</span>
      </a>
    </div>
    <div class="navgroup">
      <h6>Activity</h6>
      <a data-view="events">
        <svg class="nicon" viewBox="0 0 18 18" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="1.5,9 5,9 7,3.5 11,14.5 13,9 16.5,9"/>
        </svg>
        <span>Events</span>
      </a>
    </div>
    <div class="side-foot"><span id="side-health" class="pill">…</span></div>
  </nav>
  <main id="main">
    <header id="topbar">
      <div><small id="crumb">LOCAL ADMIN</small><h1 id="title">Overview</h1></div>
      <div id="top-status-wrap">
        <div id="top-status"></div>
        <small id="last-activity" class="muted"></small>
      </div>
    </header>
    <section id="view-overview" class="view"></section>
    <section id="view-providers" class="view" hidden></section>
    <section id="view-routing" class="view" hidden></section>
    <section id="view-events" class="view" hidden></section>
    <section id="view-config" class="view" hidden></section>
  </main>
  <footer id="config-actionbar" class="action-bar" hidden>
    <div class="action-meta">
      <strong id="dirtyState">No changes</strong>
    </div>
    <div id="configMessage" class="message-area"></div>
    <div class="action-buttons">
      <button id="validateButton" class="secondary-button" type="button">Validate</button>
      <button id="applyButton" class="primary-button" type="button" disabled>Apply</button>
    </div>
  </footer>
</div>
<script src="/admin/ui/app.js"></script>
</body>
</html>
