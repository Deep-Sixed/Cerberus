<!DOCTYPE html>
<!-- Cerberus admin console. Read + live-probe only: renders state and health,
     never mutates config (config lifecycle stays git + the /admin API). No inline
     script/style, no forms; interactive controls are built in app.js and only
     issue same-origin GETs. CSP is set by the server. -->
<html lang="en">
<head>
<meta charset="utf-8">
<title>Cerberus</title>
<link rel="stylesheet" href="/admin/ui/app.css">
</head>
<body>
<div id="app">
  <nav id="side">
    <div class="brand"><span class="logo">C</span><div><b>Cerberus</b><small>gateway console</small></div></div>
    <a data-view="overview" class="active">Overview</a>
    <a data-view="providers">Providers</a>
    <a data-view="routing">Model Routing</a>
    <a data-view="events">Events</a>
    <div class="side-foot"><span id="side-health" class="pill">…</span></div>
  </nav>
  <main id="main">
    <header id="topbar">
      <div><small id="crumb">LOCAL ADMIN</small><h1 id="title">Overview</h1></div>
      <div id="top-status"></div>
    </header>
    <section id="view-overview" class="view"></section>
    <section id="view-providers" class="view" hidden></section>
    <section id="view-routing" class="view" hidden></section>
    <section id="view-events" class="view" hidden></section>
  </main>
</div>
<script src="/admin/ui/app.js"></script>
</body>
</html>
