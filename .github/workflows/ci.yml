name: public-release
on: [push, pull_request]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          fetch-depth: 0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: 3.14.5
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 26.3.1
      - run: python -m pip install uv==0.11.29
      - run: uv sync --frozen --python 3.14.5
      - run: ./scripts/ci.sh
      - run: python scripts/verify-worker-provenance.py
      - run: uv build --no-build-isolation
      - run: node --check src/cerberus/ui/static/app.js
      - run: python scripts/check-compose.py
      - run: docker build -f Containerfile -t cerberus:ci .
      - run: uv sync --frozen --extra dev --project third_party/fusion_backend --python 3.14.5
      - run: uv run --frozen --extra dev python -m pytest -q
        working-directory: third_party/fusion_backend
      - run: uv run --frozen --extra dev ruff check fusion_backend tests
        working-directory: third_party/fusion_backend
      - run: npm ci --ignore-scripts --no-audit
        working-directory: third_party/fusion_backend/web
      - run: npm audit --audit-level=low
        working-directory: third_party/fusion_backend/web
      - run: npm test
        working-directory: third_party/fusion_backend/web
      - run: npm run build -- --outDir "$RUNNER_TEMP/fusion_backend-web"
        working-directory: third_party/fusion_backend/web
      - run: docker build -f third_party/Containerfile.fusion_backend -t cerberus-fusion-worker:ci .
      - name: Install checksum-verified Gitleaks
        run: |
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz
          curl -fsSLO https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_checksums.txt
          grep '  gitleaks_8.30.1_linux_x64.tar.gz$' gitleaks_8.30.1_checksums.txt | sha256sum -c -
          tar -xzf gitleaks_8.30.1_linux_x64.tar.gz gitleaks
          sudo install gitleaks /usr/local/bin/gitleaks
          rm gitleaks gitleaks_8.30.1_linux_x64.tar.gz gitleaks_8.30.1_checksums.txt
      - run: sh scripts/scan-secrets.sh
